name: marketing_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.11.4'

resolution: workspace

dependencies:
  serverpod: 3.4.9
  serverpod_auth_idp_server: 3.4.9

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.9
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations
