services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fulfillment
      POSTGRES_PASSWORD: "${SERVICE_DB_PASSWORD:-devpass}"
    volumes:
      - fulfillment_data:/var/lib/postgresql

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg18
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fulfillment_test
      POSTGRES_PASSWORD: "${SERVERPOD_PASSWORD_database:?set in services/<svc>/server/.env (local) or CI secret}"
    volumes:
      - fulfillment_test_data:/var/lib/postgresql

volumes:
  fulfillment_data:
  fulfillment_test_data:
