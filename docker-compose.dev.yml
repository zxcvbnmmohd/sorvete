# ============================================================================
# Dev-mode override for docker-compose.yml.
#
# Use alongside the base compose:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d \
#       <svc>-server <svc>-postgres ...
#
# (or via scripts/dev_all.sh, which composes both files automatically)
#
# Each backend in this file:
#   • Overrides the GHCR image with the local dev runtime
#     (sorvete-dev-server:local — see .docker/Dockerfile.server.dev)
#   • Bind-mounts host source so edits take effect without rebuild
#   • Runs the JIT watcher that restarts the Dart process on file change
#
# Postgres containers are NOT overridden — same image, same volumes, same
# healthchecks as production.
#
# NOTE: workspace `.dart_tool/` is hidden by an anonymous volume so the
# container's resolved package config doesn't collide with the host's
# (different Dart versions, different paths).
# ============================================================================

name: sorvete

x-dev-backend: &dev-backend
  image: sorvete-dev-server:local
  pull_policy: never
  restart: unless-stopped
  environment:
    runmode: production
    SERVERPOD_PASSWORD_database: ${DB_PASSWORD:?DB_PASSWORD must be set}

services:
  ads-server:
    <<: *dev-backend
    ports:
      - "8100:8080"
    volumes:
      - ./services/ads/server:/app/server:cached
      - pub_cache:/root/.pub-cache
      - /app/server/.dart_tool

  analytics-server:
