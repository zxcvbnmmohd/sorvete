# ============================================================================
# Production compose for the Sorvete platform — Dokploy reads this file.
# Pulls pre-built images from GHCR (built + pushed by .github/workflows/ci.yml,
# gated behind the full test suite).
# No Flutter SDK or Dart toolchain ever runs on the deploy host.
#
# Required Dokploy environment variables:
#   GHCR_OWNER     GitHub user/org owning the GHCR packages (e.g. zxcvbnmmohd)
#   IMAGE_TAG      Tag to deploy. Set per environment to the branch name:
#                  "develop" / "staging" / "production" (or a SHA for pins).
#                  Defaults to "dev" — the local-build tag (scripts/build_all.sh).
#   DB_PASSWORD    Shared Postgres password for every backend service.
#
# Each backend listens on internal :8080. No host ports are mapped — Dokploy /
# Traefik routes external traffic to each container by hostname. Frontends
# expose host ports 5001-5006 (Flutter web served via nginx).
#
# Migrations: every backend container runs `--apply-migrations` on start
# (idempotent — Serverpod tracks applied migrations per-DB).
# ============================================================================

name: sorvete

x-default: &default
  restart: unless-stopped
  pull_policy: always

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (Dokploy → Environment)}

x-backend-env: &backend-env
  runmode: production
  SERVERPOD_PASSWORD_database: ${DB_PASSWORD:?DB_PASSWORD must be set (Dokploy → Environment)}

x-postgres-health: &postgres-health
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  # -------- Flutter web frontends (6 apps, host ports 5001-5006) --------
  admin:
    <<: *default
    image: ghcr.io/${GHCR_OWNER}/sorvete-admin-web:${IMAGE_TAG:-dev}
    ports:
      - "5001:80"

  customer:
    <<: *default
    image: ghcr.io/${GHCR_OWNER}/sorvete-customer-web:${IMAGE_TAG:-dev}
    ports:
      - "5002:80"

  driver:
    <<: *default
    image: ghcr.io/${GHCR_OWNER}/sorvete-driver-web:${IMAGE_TAG:-dev}
    ports:
      - "5003:80"

  merchant:
    <<: *default
    image: ghcr.io/${GHCR_OWNER}/sorvete-merchant-web:${IMAGE_TAG:-dev}
    ports:
      - "5004:80"

  pos:
    <<: *default
    image: ghcr.io/${GHCR_OWNER}/sorvete-pos-web:${IMAGE_TAG:-dev}
    ports:
      - "5005:80"

  kds:
    <<: *default
    image: ghcr.io/${GHCR_OWNER}/sorvete-kds-web:${IMAGE_TAG:-dev}
    ports:
      - "5006:80"

  # -------- 32 Serverpod backends (internal :8080, per-service Postgres) --------
  ads-server:
    <<: *default
    image: ghcr.io/${GHCR_OWNER}/sorvete-ads-server:${IMAGE_TAG:-dev}
    depends_on:
      ads-postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
    expose:
      - "8080"

  ads-postgres:
    <<: *default
    image: pgvector/pgvector:pg18
    environment:
      <<: *postgres-env
      POSTGRES_DB: ads
    volumes:
      - ads_data:/var/lib/postgresql
    healthcheck:
      <<: *postgres-health

